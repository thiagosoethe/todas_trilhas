<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TodoList Senai</title>
    <link rel="stylesheet" href="/public/style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <main>
        <h1>TodoList Senai</h1>

        <form action="/" method="POST">
            <input type="text" name="task" placeholder="Digite uma tarefa">
            <button type="submit">Adicionar</button>
        </form>

        <ul>
            <% tasksList.forEach(function(task, index) { %>
                <li>
                    <span><%= task %></span>
                    <a href="/deletar/<%= index %>" class="remover">Remover</a>
                </li>
            <% }) %>
        </ul>
    </main>

    <script>
        const links = document.querySelectorAll(".remover");

        links.forEach(function(link) {
            link.addEventListener("click", function(event) {
                event.preventDefault();

                Swal.fire({
                    title: "Remover tarefa?",
                    icon: "warning",
                    showCancelButton: true,
                    confirmButtonText: "Sim",
                    cancelButtonText: "Cancelar"
                }).then(function(resultado) {
                    if (resultado.isConfirmed) {
                        window.location.href = link.href;
                    }
                });
            });
        });
    </script>
</body>
</html>
