<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro App Vue.js</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 500px;
            margin: 80px auto;
            background-color: #9acd32;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: blue;
            font-size: 36px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #333;
        }

        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="app" class="container">
        <h1>Olá, {{ nome }}!!</h1>

        <p>Digite seu nome abaixo:</p>

        <input type="text" v-model="nome" placeholder="Digite seu nome">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.js"></script>

    <script>
        var app = new Vue({
            el: "#app",
            data: {
                nome: "Vue"
            }
        });
    </script>

</body>
</html>
