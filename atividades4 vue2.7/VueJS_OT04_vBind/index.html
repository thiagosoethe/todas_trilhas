<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue JS - Diretiva v-bind</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        #app {
            width: 90%;
            max-width: 700px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
            text-align: center;
        }

        h1 {
            color: #222;
            margin-bottom: 25px;
        }

        img {
            width: 220px;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            line-height: 1.5;
        }

        .red {
            color: red;
        }

        .green {
            color: green;
        }

        .blue {
            color: blue;
        }

        .botoes {
            margin-top: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <div id="app">
        <h1>{{ titulo }}</h1>

        <img
            v-bind:src="imagem"
            v-bind:alt="textoAlternativo"
            v-bind:data-img-large="imagemGrande"
        >

        <p v-bind:class="classe">
            Lorem ipsum dolor sit amet, consectetur adipisicing elit.
            Cupiditate placeat illo iste, expedita quos culpa dolor,
            molestiae quod, quibusdam harum quia? Laborum, possimus!
            Quaerat quis repellat voluptatem atque quod reprehenderit.
        </p>

        <div class="botoes">
            <button v-on:click="classe = 'red'">Vermelho</button>
            <button v-on:click="classe = 'green'">Verde</button>
            <button v-on:click="classe = 'blue'">Azul</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>

    <script>
        var app = new Vue({
            el: "#app",
            data: {
                titulo: "Aprendendo Vue JS",
                imagem: "https://br.vuejs.org/images/logo.png",
                imagemGrande: "https://br.vuejs.org/images/logo.png",
                textoAlternativo: "Vuejs is awesome!",
                classe: "green"
            }
        });
    </script>

</body>
</html>
